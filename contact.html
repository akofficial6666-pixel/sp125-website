<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Honda SP 125</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">Honda SP 125</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a><a href="about.html">About</a><a href="features.html">Features</a><a
                    href="specifications.html">Specifications</a><a href="variants.html">Variants</a><a
                    href="gallery.html">Gallery</a><a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <h1>Contact & Feedback</h1>
        <p>Feel free to send your suggestions or feedback about this Honda SP 125 project.</p>

        <form class="contact-form" action="#" method="get">
            <div class="form-group">
                <label for="visitor-name">Your Name:</label>
                <input type="text" id="visitor-name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="visitor-email">Your Email:</label>
                <input type="email" id="visitor-email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="visitor-topic">Feedback Topic:</label>
                <select id="visitor-topic" name="topic">
                    <option value="design">Website Design</option>
                    <option value="specs">Bike Information</option>
                    <option value="suggestion">Suggestions</option>
                </select>
            </div>

            <div class="form-group">
                <label for="visitor-feedback">Your Message:</label>
                <textarea id="visitor-feedback" name="feedback" rows="4" placeholder="Write your feedback here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <p class="project-roll">Note: This is a front-end form created for demonstration purposes.</p>
    </main>
    <footer class="site-footer">
        <p><strong>Honda SP 125 — My Website Project</strong></p>
        <p>I peronally own this Bike</p>
    </footer>
</body>

</html>
